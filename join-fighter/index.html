<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join as a Fighter | Crush Combat Agency</title>
    <meta name="description" content="Sign up for representation with Crush Combat Agency — elite MMA talent management across Southeast Asia.">
    <meta property="og:title" content="Join as a Fighter | Crush Combat Agency">
    <meta property="og:description" content="Sign up for representation with Crush Combat Agency.">
    <meta property="og:url" content="https://zaccrush.com/join-fighter/">
    <meta name="theme-color" content="#FAF9F5">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['"Source Serif 4"', 'Georgia', 'serif'],
                        display: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        ink: '#141413', 'ink-soft': '#3D3D3A', clay: '#D97757', 'clay-dark': '#C6613F',
                        cream: '#FAF9F5', 'cream-alt': '#F0EEE6',
                    },
                },
            },
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="min-h-screen flex flex-col bg-cream">
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p class="text-lg font-semibold font-display">Submitting your application...</p>
    </div>

    <header class="fixed top-0 left-0 right-0 z-50 bg-cream/90 backdrop-blur-sm border-b border-black/10">
        <nav class="max-w-6xl mx-auto flex items-center justify-between px-4 sm:px-6 py-4">
            <a href="/" class="font-display text-lg font-extrabold tracking-tight text-ink">CRUSH <span class="text-clay">COMBAT</span></a>
            <button id="nav-toggle" class="sm:hidden text-ink p-2" aria-label="Toggle menu" aria-expanded="false">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div id="nav-links" class="hidden sm:flex flex-col sm:flex-row items-center gap-x-8 gap-y-3 sm:gap-y-0 text-sm font-medium font-display absolute sm:static top-full inset-x-0 sm:inset-auto bg-cream sm:bg-transparent border-t sm:border-0 border-black/10 px-4 sm:px-0 py-4 sm:py-0">
                <a href="/" class="text-ink/70 hover:text-ink transition-colors">Home</a>
                <a href="/roster/" class="text-ink/70 hover:text-ink transition-colors">Roster</a>
                <a href="/services/" class="text-ink/70 hover:text-ink transition-colors">Services</a>
                <a href="/media/" class="text-ink/70 hover:text-ink transition-colors">Media</a>
                <a href="/faq.html" class="text-ink/70 hover:text-ink transition-colors">FAQ</a>
                <a href="/partner-inquiry/" class="text-ink/70 hover:text-ink transition-colors">Partner With Us</a>
            </div>
        </nav>
    </header>

    <main class="flex-grow pt-28 pb-16 px-4 sm:px-6">
        <div class="max-w-2xl mx-auto">
            <header class="text-center mb-8">
                <p class="eyebrow">Talent Management</p>
                <h1 class="font-display text-3xl sm:text-4xl font-extrabold text-ink mt-2">Join as a Fighter</h1>
                <p class="font-serif text-lg text-ink-soft mt-3">Tell us about yourself. Crush Combat Agency reviews every submission.</p>
            </header>

            <form name="fighter-signup" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="space-y-6" id="fighter-signup-form">
                <input type="hidden" name="form-name" value="fighter-signup" />
                <input type="hidden" name="redirect" value="./success.html" />
                <p class="hidden"><label>Don't fill this out: <input name="bot-field" /></label></p>

                <div class="glass-card p-6 sm:p-8 rounded-2xl space-y-4">
                    <div>
                        <label for="name" class="block text-sm font-medium text-ink-soft">Full Name</label>
                        <input type="text" id="name" name="name" required class="input-field mt-1 block rounded-lg">
                    </div>
                    <div>
                        <label for="ring-name" class="block text-sm font-medium text-ink-soft">Ring/Fighter Name</label>
                        <input type="text" id="ring-name" name="ring-name" class="input-field mt-1 block rounded-lg">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-ink-soft">Email Address</label>
                        <input type="email" id="email" name="email" required class="input-field mt-1 block rounded-lg">
                    </div>
                    <div>
                        <label for="phone" class="block text-sm font-medium text-ink-soft">Phone / Zalo / WhatsApp</label>
                        <input type="text" id="phone" name="phone" class="input-field mt-1 block rounded-lg">
                    </div>
                    <div>
                        <label for="discipline" class="block text-sm font-medium text-ink-soft">Discipline</label>
                        <select id="discipline" name="discipline" required class="input-field mt-1 block rounded-lg">
                            <option value="">Select...</option>
                            <option value="MMA">MMA</option>
                            <option value="Muay Thai">Muay Thai</option>
                            <option value="BJJ/Grappling">BJJ / Grappling</option>
                            <option value="Boxing">Boxing</option>
                            <option value="Wrestling">Wrestling</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label for="gym" class="block text-sm font-medium text-ink-soft">Current Gym / Team</label>
                        <input type="text" id="gym" name="gym" class="input-field mt-1 block rounded-lg">
                    </div>
                    <div>
                        <label for="location" class="block text-sm font-medium text-ink-soft">City / Location</label>
                        <input type="text" id="location" name="location" class="input-field mt-1 block rounded-lg">
                    </div>
                    <div>
                        <label for="weight" class="block text-sm font-medium text-ink-soft">Weight (kg)</label>
                        <input type="number" step="0.1" id="weight" name="weight" class="input-field mt-1 block rounded-lg">
                    </div>
                    <div>
                        <label for="experience" class="block text-sm font-medium text-ink-soft">Experience Level</label>
                        <select id="experience" name="experience" required class="input-field mt-1 block rounded-lg">
                            <option value="">Select...</option>
                            <option value="No competition yet">No competition yet</option>
                            <option value="Amateur">Amateur</option>
                            <option value="Semi-Pro">Semi-Pro</option>
                            <option value="Professional">Professional</option>
                        </select>
                    </div>
                    <div>
                        <label for="highlight" class="block text-sm font-medium text-ink-soft">Highlight Reel / Fight Record Link</label>
                        <input type="url" id="highlight" name="highlight" placeholder="https://..." class="input-field mt-1 block rounded-lg">
                    </div>
                    <div>
                        <label for="social" class="block text-sm font-medium text-ink-soft">Instagram / Social Handle</label>
                        <input type="text" id="social" name="social" class="input-field mt-1 block rounded-lg">
                    </div>
                    <div>
                        <label for="looking-for" class="block text-sm font-medium text-ink-soft">What are you looking for from an agency?</label>
                        <textarea id="looking-for" name="looking-for" rows="4" class="input-field mt-1 block rounded-lg"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-clay w-full py-4 text-lg rounded-xl">Submit Application</button>
            </form>
        </div>
    </main>

    <footer class="bg-cream border-t border-black/10 py-10 px-4">
        <div class="max-w-4xl mx-auto">
            <div class="flex flex-wrap justify-center items-center gap-x-6 gap-y-2 mb-6 font-display text-sm text-ink/70">
                <a href="https://www.linkedin.com/in/zac-crush/" target="_blank" rel="noopener" class="hover:text-ink transition-colors">LinkedIn</a>
                <a href="https://www.instagram.com/zcrush13/" target="_blank" rel="noopener" class="hover:text-ink transition-colors">Instagram</a>
                <a href="https://www.facebook.com/crushza" target="_blank" rel="noopener" class="hover:text-ink transition-colors">Facebook</a>
                <a href="mailto:hello@zaccrush.com" class="hover:text-ink transition-colors">hello@zaccrush.com</a>
            </div>
            <p class="text-sm text-center text-ink/60 font-display">© 2026 Crush Combat Agency. All rights reserved.</p>
        </div>
    </footer>

    <script src="/assets/nav.js" defer></script>
    <script>
        document.getElementById('fighter-signup-form').addEventListener('submit', function () {
            document.getElementById('loading-overlay').style.display = 'flex';
        });
    </script>
</body>
</html>
