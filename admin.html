<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0a0b0f; color: #e5e7eb; }
    .input-field {
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 0.6rem;
        padding: 0.75rem 1rem;
        color: #fff;
        width: 100%;
        transition: all 0.2s;
    }
    .input-field:focus { outline: none; box-shadow: 0 0 0 2px #d4af37; border-color: #d4af37; }
    .input-field::placeholder { color: #6b7280; }
  </style>
</head>
<body class="min-h-screen p-6 sm:p-10">
  <div class="max-w-md mx-auto space-y-6">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-semibold text-white">Admin Dashboard</h1>
      <!-- Netlify Identity login/logout button -->
      <div data-netlify-identity-button></div>
    </div>

    <!-- Registration Form -->
    <form name="saigon-superfights" method="POST" data-netlify="true" class="space-y-4 bg-[#12141a] border border-white/10 rounded-2xl p-6">
      <input type="text" name="name" placeholder="Full Name" required class="input-field">
      <input type="text" name="instagram" placeholder="Instagram" class="input-field">
      <input type="text" name="zalo" placeholder="Zalo" class="input-field">

      <select name="belt" required class="input-field">
        <option value="">Select belt color</option>
        <option value="white">White</option>
        <option value="blue">Blue</option>
        <option value="purple">Purple</option>
        <option value="brown">Brown</option>
        <option value="black">Black</option>
      </select>

      <input type="number" name="weight" placeholder="Weight in kg" required class="input-field">
      <input type="text" name="idealOpponent" placeholder="Ideal Opponent" class="input-field">

      <button type="submit" class="w-full px-6 py-3 font-bold text-white bg-[#dc2626] rounded-lg hover:bg-[#b91c1c] transition-colors">Register</button>
    </form>
  </div>

  <!-- Netlify Identity script -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Redirect to dashboard after login -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin.html";
          });
        }
      });
    }
  </script>

</body>
</html>
