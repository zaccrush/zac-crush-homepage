  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Oswald', 'sans-serif'],
          },
          colors: {
            'gma-gold': '#d4af37',
            'gma-red': '#dc2626',
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0a0b0f;
      color: #e5e7eb;
      font-family: 'Inter', sans-serif;
      background-image: url('https://github.com/zaccrush/zac-crush-homepage/blob/main/saigon-superfights-grappling-ram-muay-thai.jpeg?raw=true');
      background-size: cover;
      background-position: center center;
    }
    .font-display { font-family: 'Oswald', sans-serif; }
    .body-overlay {
      background-color: rgba(10, 11, 15, 0.92);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background-color: rgba(18, 20, 26, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      padding: 2.5rem 2rem;
      border-radius: 1.25rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .btn-primary {
      background-color: #dc2626;
      transition: background-color 0.25s, transform 0.25s;
      box-shadow: 0 10px 25px rgba(220, 38, 38, 0.25);
    }
    .btn-primary:hover { background-color: #b91c1c; transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="body-overlay">
    <div class="card">
      <div class="mx-auto mb-4 w-14 h-14 rounded-full bg-gma-gold/15 border border-gma-gold flex items-center justify-center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-gma-gold"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <img src="https://raw.githubusercontent.com/zaccrush/zac-crush-homepage/4f38e25754d34b0e66645603976bb5e4d4e24916/saigon%20superfights%20logo.jpg"
           alt="Saigon Superfights Logo"
           class="w-48 mx-auto mb-4 rounded-lg">

      <h1 class="font-display text-2xl sm:text-3xl font-bold text-gma-gold uppercase tracking-wider mb-2">
        Registration Successful!
      </h1>
      <p class="text-gray-300 mb-6">
        Thank you for signing up to compete in Saigon Superfights.
        We’ll review your registration and be in touch with more details soon.
      </p>

      <a href="/saigon-superfights-registration"
         class="btn-primary inline-block px-6 py-3 text-lg font-bold text-white rounded-lg shadow-lg">
        Back to Registration
      </a>

      <p class="text-sm text-gray-400 mt-4">
        You’ll be redirected back automatically in <span id="countdown">5</span> seconds.
      </p>
    </div>
  </div>

  <script>
    let seconds = 5;
    const countdown = document.getElementById('countdown');
    const redirectUrl = "/saigon-superfights-registration";

    const timer = setInterval(() => {
      seconds--;
      countdown.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = redirectUrl;
      }
    }, 1000);
  </script>
</body>
</html>
