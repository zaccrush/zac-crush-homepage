<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saigon Superfights | Grappling and Boxing Registration</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="Register to compete in Saigon Superfights for grappling and boxing matches in Vietnam.">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="Saigon Superfights | Grappling and Boxing Registration">
  <meta property="og:description" content="Register to compete in Saigon Superfights for grappling and boxing matches in Vietnam.">
  <meta property="og:image" content="https://github.com/zaccrush/zac-crush-homepage/blob/main/saigon-superfights-registration/ssf-v-social-image.jpeg?raw=true">
  <meta property="og:image:alt" content="Saigon Superfights Social Preview Image">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Saigon Superfights | Grappling and Boxing Registration">
  <meta name="twitter:description" content="Register to compete in Saigon Superfights for grappling and boxing matches in Vietnam.">
  <meta name="twitter:image" content="https://github.com/zaccrush/zac-crush-homepage/blob/main/saigon-superfights-registration/ssf-v-social-image.jpeg?raw=true">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            'gma-gold': '#d4af37',
          }
        },
      },
    };
  </script>

  <!-- Fonts & Custom Styles -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

    body {
      background-color: #111; /* Fallback */
      color: #eee;
      font-family: 'Inter', sans-serif;
      background-image: url('https://github.com/zaccrush/zac-crush-homepage/blob/main/saigon-superfights-grappling-ram-muay-thai.jpeg?raw=true');
      background-size: cover;
      background-position: center center;
      background-attachment: fixed;
    }
    .body-overlay {
      background-color: rgba(0, 0, 0, 0.85);
    }
    .card {
      background-color: rgba(30, 30, 30, 0.9);
      border: 1px solid #444;
      backdrop-filter: blur(4px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 5px 10px rgba(0, 0, 0, 0.2);
    }
    .input-field {
      background-color: #333;
      border-color: #555;
      transition: all 0.2s ease-in-out;
      font-size: 16px; /* Prevent iOS Safari zoom */
    }
    .input-field:focus {
      box-shadow: 0 0 0 2px #d4af37;
      border-color: #d4af37;
      outline: none;
    }
    .text-gold { color: #d4af37; }
    .hover\:text-gold:hover { color: #d4af37; }
  </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

  <!-- Sticky Header -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-[#111]/80 backdrop-blur-sm border-b border-b-[#444]">
    <nav class="max-w-5xl mx-auto flex justify-center items-center p-4 text-sm">
      <div class="flex flex-wrap justify-center items-center gap-x-4 sm:gap-x-6 gap-y-2">
        <a href="https://zaccrush.com/" class="text-gray-300 hover:text-gold transition-colors font-semibold">Home</a>
        <a href="https://www.youtube.com/@GMAFightingChampionship" target="_blank" rel="noopener" class="text-gray-300 hover:text-gold transition-colors font-semibold">YouTube</a>
        <a href="https://zaccrush.com/gmaregistration/" target="_blank" rel="noopener" class="text-gray-300 hover:text-gold transition-colors font-semibold">GMA Fighter Registration</a>
        <a href="/saigon-superfights-registration" class="text-gray-300 hover:text-gold transition-colors font-semibold">Saigon Superfights Registration</a>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="flex-grow pt-24 body-overlay">
    <div class="max-w-2xl mx-auto p-4 sm:p-6">
      
      <!-- Page Header -->
      <header class="text-center mb-6">
        <img src="https://raw.githubusercontent.com/zaccrush/zac-crush-homepage/4f38e25754d34b0e66645603976bb5e4d4e24916/saigon%20superfights%20logo.jpg" alt="Saigon Superfights Logo" class="w-72 sm:w-96 max-w-full mx-auto mb-2 rounded-lg">
        <h1 class="text-2xl sm:text-3xl font-bold text-yellow-400 uppercase tracking-wider">Grappling and Boxing</h1>
        <p class="text-gray-400 text-sm mt-1">Register to compete in an upcoming event.</p>
      </header>

      <!-- Netlify Registration Form -->
      <form name="ssf-registration" method="POST" action="/success.html" data-netlify="true" netlify-honeypot="bot-field" class="space-y-6">
        <input type="hidden" name="form-name" value="ssf-registration" />

        <!-- Honeypot -->
        <p class="hidden">
          <label>Don’t fill this out if you're human: <input name="bot-field" /></label>
        </p>

        <div class="card p-4 sm:p-6 rounded-lg space-y-4">
          <div>
            <label for="name" class="block text-sm font-medium text-gray-300">Full Name</label>
            <input type="text" id="name" name="name" required class="input-field mt-1 block w-full rounded-md p-3 text-white">
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-gray-300">Email Address</label>
            <input type="email" id="email" name="email" required class="input-field mt-1 block w-full rounded-md p-3 text-white">
          </div>

          <div>
            <label for="birthYear" class="block text-sm font-medium text-gray-300">Birth Year</label>
            <input type="number" id="birthYear" name="birthYear" required placeholder="e.g., 1995" min="1900" max="2025" class="input-field mt-1 block w-full rounded-md p-3 text-white">
          </div>

          <div>
            <label for="team" class="block text-sm font-medium text-gray-300">Team</label>
            <input type="text" id="team" name="team" class="input-field mt-1 block w-full rounded-md p-3 text-white">
          </div>

          <div>
            <label for="weight" class="block text-sm font-medium text-gray-300">Weight (kg)</label>
            <input type="number" step="0.1" id="weight" name="weight" required min="20" max="200" class="input-field mt-1 block w-full rounded-md p-3 text-white">
          </div>

          <div>
            <label for="matchType" class="block text-sm font-medium text-gray-300">What type of match would you like?</label>
            <select id="matchType" name="matchType" required class="input-field mt-1 block w-full rounded-md p-3 text-white">
              <option value="">Select Match Type...</option>
              <option value="Grappling">Grappling</option>
              <option value="Boxing">Boxing</option>
              <option value="Either Grappling or Boxing">Either Grappling or Boxing!</option>
            </select>
          </div>

          <div>
            <label for="belt" class="block text-sm font-medium text-gray-300">BJJ Belt Level (if applicable)</label>
            <select id="belt" name="belt" class="input-field mt-1 block w-full rounded-md p-3 text-white">
              <option value="">Select Belt...</option>
              <option value="White">White</option>
              <option value="Blue">Blue</option>
              <option value="Purple">Purple</option>
              <option value="Brown">Brown</option>
              <option value="Black">Black</option>
              <option value="N/A">N/A</option>
            </select>
          </div>

          <div>
            <label for="boxingExperience" class="block text-sm font-medium text-gray-300">Years experience in boxing (short answer)</label>
            <input type="text" id="boxingExperience" name="boxingExperience" class="input-field mt-1 block w-full rounded-md p-3 text-white">
          </div>

          <div>
            <label for="fightStatus" class="block text-sm font-medium text-gray-300">Status</label>
            <select id="fightStatus" name="fightStatus" required class="input-field mt-1 block w-full rounded-md p-3 text-white">
              <option value="Ready to Fight!">Ready to Fight!</option>
              <option value="Not Looking for Superfight">Not Looking for Superfight</option>
            </select>
          </div>

          <div>
            <label for="idealOpponent" class="block text-sm font-medium text-gray-300">Ideal Opponent (Optional)</label>
            <input type="text" id="idealOpponent" name="idealOpponent" placeholder="Name, weight, belt, style..." class="input-field mt-1 block w-full rounded-md p-3 text-white">
          </div>

          <div>
            <label for="opportunity" class="block text-sm font-medium text-gray-300">What's one opportunity you've always wanted in martial arts?</label>
            <textarea id="opportunity" name="opportunity" rows="3" required class="input-field mt-1 block w-full rounded-md p-3 text-white"></textarea>
          </div>

          <div>
            <label for="excitement" class="block text-sm font-medium text-gray-300">How could we make this app more exciting?</label>
            <textarea id="excitement" name="excitement" rows="3" required class="input-field mt-1 block w-full rounded-md p-3 text-white"></textarea>
          </div>
        </div>

        <div>
          <button type="submit" class="w-full px-6 py-4 text-lg font-bold text-white bg-red-600 rounded-lg shadow-lg hover:bg-red-700 transition-all duration-300">
            Submit Registration
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#111] border-t border-t-[#444] text-gray-400 text-center py-8 px-4">
    <div class="max-w-4xl mx-auto">
      <div class="flex flex-wrap justify-center items-center gap-x-6 gap-y-2 mb-6">
        <a href="https://www.linkedin.com/in/zac-crush/" target="_blank" rel="noopener" class="hover:text-gold transition-colors">LinkedIn</a>
        <a href="https://www.instagram.com/zcrush13/" target="_blank" rel="noopener" class="hover:text-gold transition-colors">Instagram</a>
        <a href="https://www.youtube.com/@GMAFightingChampionship" target="_blank" rel="noopener" class="hover:text-gold transition-colors">YouTube</a>
        <a href="https://www.facebook.com/crushza" target="_blank" rel="noopener" class="hover:text-gold transition-colors">Facebook</a>
        <a href="mailto:hello@zaccrush.com" class="hover:text-gold transition-colors">hello@zaccrush.com</a>
        <a href="/faq.html" class="hover:text-gold transition-colors">FAQ</a>
      </div>
      <p class="text-sm mb-2">© 2025 Zac Crush. All rights reserved.</p>
      <p class="text-xs">Sponsored by <a href="https://shadeprotocol.io/" target="_blank" rel="noopener" class="underline hover:text-gold transition-colors">Shade Protocol: New Generation of Private DeFi</a></p>
    </div>
  </footer>

</body>
</html>
