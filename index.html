    <style>
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.8s ease-out forwards;
        }

        .text-gold { color: #d4af37; }
        .border-gold { border-color: #d4af37; }
        
        /* Hero title styles */
        .hero-title {
            text-shadow: 0px 4px 6px rgba(0, 0, 0, 0.5), 0px 8px 24px rgba(0, 0, 0, 0.5);
            transition: text-shadow 0.3s ease;
        }
        .hero-title:hover {
            text-shadow: 0px 4px 6px rgba(0, 0, 0, 0.5), 0px 8px 24px rgba(0, 0, 0, 0.5), 0 0 15px rgba(212, 175, 55, 0.8);
        }
        .hero-subtitle {
             text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.7);
        }

        /* Reusable Card Style */
        .styled-card {
            background-color: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #30363d;
            border-radius: 0.5rem; /* rounded-lg */
            padding: 1.5rem; /* p-6 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        @media (min-width: 768px) {
            .styled-card {
                padding: 2.5rem; /* md:p-10 */
            }
        }
        
        /* Reusable Section Title */
        .section-title {
            font-size: 1.875rem; /* text-3xl */
            font-weight: 700; /* font-bold */
            color: #d4af37; /* text-gold */
            text-align: center;
            margin-bottom: 2rem; /* mb-8 */
        }
        @media (min-width: 768px) {
            .section-title {
                font-size: 2.25rem; /* md:text-4xl */
            }
        }
        
        /* Reusable button style */
        .styled-button {
            padding: 0.75rem 1.5rem; /* px-6 py-3 */
            background-color: #374151; /* bg-gray-700 */
            border-radius: 0.5rem; /* rounded-lg */
            color: white;
            font-weight: 600; /* font-semibold */
            transition: all 0.3s ease-in-out;
        }
        .styled-button:hover {
            background-color: #d4af37; /* hover:bg-gold */
            color: black; /* hover:text-black */
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        
        /* General hover effect for cards/links */
        .hover-lift {
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }
        .hover-lift:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
        }
        
        .main-content-bg {
            background-image: 
                radial-gradient(circle at 50% 0, rgba(22, 27, 34, 0.3) 0%, rgba(13, 17, 23, 1) 70%),
                linear-gradient(rgba(13, 17, 23, 0.98), rgba(13, 17, 23, 0.98)), 
                url('https://github.com/zaccrush/zac-crush-homepage/blob/main/vietnam%20drone%20shot%20by%20zac%20crush.jpg?raw=true');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .hover\\:text-gold:hover {
             color: #d4af37;
        }
        
        /* Bulletin Board Styles */
        .bulletin-note {
            background-color: #ffffe0; /* Light yellow like a sticky note */
            color: #333;
            padding: 1rem 1.5rem;
            border-radius: 0.25rem;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden; /* To contain the pin */
        }
        .bulletin-note:hover {
            transform: scale(1.05) rotate(0deg) !important; /* Reset rotation on hover and scale up */
            box-shadow: 8px 8px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }
        /* Simple pin element */
        .bulletin-note::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background-color: #ff4136; /* Red pin head */
            border-radius: 50%;
            border: 1px solid #a32921;
            box-shadow: 0 0 3px rgba(0,0,0,0.4);
        }
    </style>
