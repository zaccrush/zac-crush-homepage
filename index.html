  <style>
    :root {
      --black: #050505;
      --gold: #E5B84B;
      --red: #EE2B2B;

      --gutter: clamp(16px, 4vw, 40px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--black); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--black);
      color: var(--cream);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;

    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .mono { font-family: var(--mono); text-transform: uppercase; letter-spacing: .22em; font-size: 11px; font-weight: 600; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); vertical-align: 1px; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }

    /* ---------- Header ---------- */
    .site-header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 16px var(--gutter);
      padding-top: max(16px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--line);
    }
    .brand { margin: 0; font-size: inherit; font-weight: inherit; }
    .brand a { display: flex; align-items: center; gap: 14px; }
    .brand svg { width: 42px; height: 42px; flex: none; }
    .brand .name { display: block; font-weight: 900; font-size: 19px; letter-spacing: .16em; line-height: 1; }
    .brand .role { display: block; margin-top: 7px; color: var(--cream-2); font-size: 9.5px; letter-spacing: .2em; }
    .book {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 10px 14px; border: 1px solid rgba(229, 184, 75, .45); color: var(--gold);
      transition: background .2s, color .2s, border-color .2s;
    }
    .book:hover { background: var(--gold); color: var(--black); border-color: var(--gold); }

    /* ---------- Main: the monitor ---------- */
    main {
      display: grid; place-items: center;
      padding: clamp(20px, 4vh, 44px) var(--gutter);
    }
    .monitor {
      width: min(100%, 1280px, calc((100svh - 300px) * 16 / 9));
      min-width: min(100%, 320px);
      margin: 0;
    }
    .hud { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--cream-2); }
    .hud-top { margin-bottom: 14px; }
    .hud-bottom { margin-top: 14px; }
    .hud .gold { color: var(--gold); }
    .tc { font-variant-numeric: tabular-nums; }

    .screen {
      position: relative; aspect-ratio: 16 / 9; background: #0b0b0b;
      isolation: isolate;
    }
    /* viewfinder brackets */
    .screen::before, .screen::after, .frame::before, .frame::after {
      content: ""; position: absolute; width: clamp(18px, 3vw, 34px); height: clamp(18px, 3vw, 34px);
      border: 0 solid var(--gold); z-index: 3; pointer-events: none;
      filter: drop-shadow(0 0 6px rgba(229, 184, 75, .55));
    }
    .screen::before { top: -9px; left: -9px; border-top-width: 3px; border-left-width: 3px; }
    .screen::after { top: -9px; right: -9px; border-top-width: 3px; border-right-width: 3px; }
    .frame::before { bottom: -9px; left: -9px; border-bottom-width: 3px; border-left-width: 3px; }
    .frame::after { bottom: -9px; right: -9px; border-bottom-width: 3px; border-right-width: 3px; }
    .frame { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

    /* slate shows behind the video, and stands in if the file is missing */
    .slate {
      position: absolute; inset: 0; z-index: 0; display: grid; place-items: center; overflow: hidden;
      background:
        radial-gradient(60% 70% at 50% 50%, rgba(238, 43, 43, .16), transparent 70%),
        linear-gradient(var(--black), #0d0a09);
    }
    .slate .bars { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); height: 15%; display: grid; align-content: space-between; opacity: .5; }
    .slate .bars i { display: block; height: clamp(2px, .45vw, 5px); background: var(--red); }
    .slate .bars i:nth-child(2) { background: var(--cream); }
    .slate svg { position: relative; width: 22%; min-width: 88px; }
    .slate .msg { position: absolute; bottom: 9%; color: var(--cream-3); }

    video {
      position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%;
      object-fit: cover; display: block; cursor: pointer; background: transparent;
    }
    .no-signal video { display: none; }

    .controls { display: flex; gap: 8px; }
    .ctl {
      display: inline-flex; align-items: center; gap: 8px;
      font: inherit; color: var(--cream); background: transparent;
      border: 1px solid var(--line); padding: 8px 12px; cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .ctl:hover { border-color: var(--gold); color: var(--gold); }
    .ctl[aria-pressed="true"] { border-color: rgba(238, 43, 43, .6); }
    .no-signal .controls { visibility: hidden; }

    /* ---------- Footer ---------- */
    .site-footer {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px;
      padding: 18px var(--gutter);
      padding-bottom: max(18px, env(safe-area-inset-bottom));

    }
    .site-footer nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; }
    .site-footer nav a { transition: color .2s; }
    .site-footer nav a:hover { color: var(--gold); }
    .site-footer nav .ext { color: var(--cream); }
    .sig { display: flex; align-items: center; gap: 18px; }
    .eastwest .gold { color: var(--gold); }
    .eastwest .red { color: var(--red); }

    @media (max-width: 640px) {
      .brand .role, .hide-sm { display: none; }
      .brand svg { width: 36px; height: 36px; }
      .brand .name { font-size: 16px; }
      .book { padding: 9px 11px; }
      .site-footer { justify-content: center; text-align: center; }
      .site-footer nav ul { justify-content: center; }
      .ctl .lbl { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
      * { transition: none !important; }
    }

  <script>
    (function () {
      var v = document.getElementById('video');
      var monitor = document.getElementById('reel');
      var tc = document.getElementById('tc');
      var playBtn = document.getElementById('play'), playIcon = document.getElementById('play-icon'), playLbl = document.getElementById('play-lbl');
      var soundBtn = document.getElementById('sound'), soundDot = document.getElementById('sound-dot'), soundLbl = document.getElementById('sound-lbl');
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.getElementById('yr').textContent = new Date().getFullYear();

      // No file yet / failed load: keep the branded slate on screen.
      var srcs = v.querySelectorAll('source');
      srcs[srcs.length - 1].addEventListener('error', function () { monitor.classList.add('no-signal'); });

      function pad(n) { return (n < 10 ? '0' : '') + n; }
      function tick() {
        var t = v.currentTime || 0;
        tc.textContent = pad(Math.floor(t / 3600)) + ':' + pad(Math.floor(t / 60) % 60) + ':' + pad(Math.floor(t) % 60) + ':' + pad(Math.floor((t % 1) * 30));
        if (!v.paused) requestAnimationFrame(tick);
      }
      function syncPlay() {
        var paused = v.paused;
        playIcon.textContent = paused ? '▶' : '❚❚';
        playLbl.textContent = paused ? 'Play' : 'Pause';
        playBtn.setAttribute('aria-label', paused ? 'Play video' : 'Pause video');
        playBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
        if (!paused) requestAnimationFrame(tick);
      }
      function togglePlay() { v.paused ? v.play() : v.pause(); }
      function toggleSound() {
        v.muted = !v.muted;
        if (!v.muted && v.paused) v.play();
        soundLbl.textContent = v.muted ? 'Sound off' : 'Sound on';
        soundDot.style.background = v.muted ? 'var(--cream-3)' : 'var(--red)';
        soundDot.classList.toggle('pulse', !v.muted);
        soundBtn.setAttribute('aria-label', v.muted ? 'Turn sound on' : 'Turn sound off');
        soundBtn.setAttribute('aria-pressed', v.muted ? 'false' : 'true');
      }

      v.addEventListener('play', syncPlay);
      v.addEventListener('pause', syncPlay);
      v.addEventListener('click', togglePlay);
      playBtn.addEventListener('click', togglePlay);
      soundBtn.addEventListener('click', toggleSound);

      if (!reduce) {
        var p = v.play();
        if (p && p.catch) p.catch(function () { syncPlay(); });
      } else {
        syncPlay();
      }
    })();
  </script>
