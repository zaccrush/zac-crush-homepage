    <style>
        /* CSS Custom Properties for better maintainability */
        :root {
            --color-gold: #d4af37;
            --color-gold-light: #e5c158;
            --color-dark-900: #0d1117;
            --color-dark-800: #161b22;
            --color-dark-700: #21262d;
            --color-dark-600: #30363d;
            --color-text: #c9d1d9;
            --transition-fast: 200ms;
            --transition-medium: 300ms;
            --transition-slow: 500ms;
        }

        /* Base styles */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--color-dark-900);
            color: var(--color-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Utility classes using CSS custom properties */
        .text-gold { 
            color: var(--color-gold); 
        }
        
        .bg-gold { 
            background-color: var(--color-gold); 
        }
        
        .border-gold { 
            border-color: var(--color-gold); 
        }

        /* Hero title with optimized shadows */
        .hero-title {
            text-shadow: 
                0 4px 6px rgba(0, 0, 0, 0.5),
                0 8px 24px rgba(0, 0, 0, 0.5);
            transition: text-shadow var(--transition-medium) ease;
            will-change: text-shadow;
        }

        .hero-title:hover {
            text-shadow: 
                0 4px 6px rgba(0, 0, 0, 0.5),
                0 8px 24px rgba(0, 0, 0, 0.5),
                0 0 15px rgba(212, 175, 55, 0.8);
        }

        .hero-subtitle {
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
        }

        /* Card component with better backdrop-filter performance */
        .styled-card {
            background-color: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--color-dark-600);
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 
                0 4px 6px rgba(0, 0, 0, 0.1),
                0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all var(--transition-medium) ease;
        }

        @media (min-width: 768px) {
            .styled-card {
                padding: 2.5rem;
            }
        }

        /* Section title component */
        .section-title {
            font-size: clamp(1.875rem, 4vw, 2.25rem);
            font-weight: 700;
            color: var(--color-gold);
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
        }

        /* Button component with better states */
        .styled-button {
            padding: 0.75rem 1.5rem;
            background-color: #374151;
            border-radius: 0.5rem;
            color: white;
            font-weight: 600;
            transition: all var(--transition-medium) cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 2px solid transparent;
            display: inline-block;
            text-decoration: none;
        }

        .styled-button:hover {
            background-color: var(--color-gold);
            color: #000;
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(212, 175, 55, 0.3);
            border-color: var(--color-gold-light);
        }

        .styled-button:active {
            transform: translateY(-2px);
        }

        .styled-button:focus-visible {
            outline: 2px solid var(--color-gold);
            outline-offset: 2px;
        }

        /* Hover lift effect with GPU acceleration */
        .hover-lift {
            transition: transform var(--transition-medium) cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow var(--transition-medium) cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        .hover-lift:hover {
            transform: translateY(-8px) translateZ(0);
            box-shadow: 
                0 12px 24px rgba(0, 0, 0, 0.25),
                0 4px 8px rgba(0, 0, 0, 0.15);
        }

        /* Optimized background with better performance */
        .main-content-bg {
            background-color: var(--color-dark-900);
            background-image: 
                radial-gradient(circle at 50% 0, rgba(22, 27, 34, 0.3) 0%, rgba(13, 17, 23, 1) 70%),
                linear-gradient(rgba(13, 17, 23, 0.98), rgba(13, 17, 23, 0.98)), 
                url('https://github.com/zaccrush/zac-crush-homepage/blob/main/vietnam%20drone%20shot%20by%20zac%20crush.jpg?raw=true');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* Better mobile background performance */
        @media (max-width: 768px) {
            .main-content-bg {
                background-attachment: scroll;
            }
        }

        /* Bulletin board styles with better transforms */
        .bulletin-note {
            --note-rotation: 0deg;
            background-color: #ffffe0;
            color: #333;
            padding: 1rem 1.5rem;
            padding-top: 1.75rem; /* Space for pin */
            border-radius: 0.25rem;
            box-shadow: 
                3px 3px 6px rgba(0, 0, 0, 0.15),
                5px 5px 10px rgba(0, 0, 0, 0.1);
            transition: 
                transform var(--transition-fast) ease,
                box-shadow var(--transition-fast) ease;
            position: relative;
            transform: rotate(var(--note-rotation)) translateZ(0);
            backface-visibility: hidden;
        }

        .bulletin-note:nth-child(odd) {
            --note-rotation: -2deg;
        }

        .bulletin-note:nth-child(even) {
            --note-rotation: 2deg;
        }

        .bulletin-note:hover {
            transform: scale(1.05) rotate(0deg) translateZ(0);
            box-shadow: 
                5px 5px 12px rgba(0, 0, 0, 0.25),
                8px 8px 15px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        /* Pin decoration */
        .bulletin-note::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #ff6659, #ff4136);
            border-radius: 50%;
            border: 1px solid #a32921;
            box-shadow: 
                0 0 3px rgba(0, 0, 0, 0.4),
                inset -1px -1px 2px rgba(0, 0, 0, 0.3);
        }

        /* Pin shadow */
        .bulletin-note::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 8px;
            background: linear-gradient(180deg, rgba(163, 41, 33, 0.4), transparent);
        }

        /* Accessibility improvements */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            .hero-title,
            .styled-button,
            .hover-lift,
            .bulletin-note {
                transition: none !important;
            }
        }

        /* Focus styles for better accessibility */
        *:focus-visible {
            outline: 2px solid var(--color-gold);
            outline-offset: 2px;
            border-radius: 0.25rem;
        }

        /* Loading state */
        .loading {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        /* Skeleton loader for better UX */
        @keyframes skeleton-loading {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .skeleton {
            background: linear-gradient(
                90deg,
                var(--color-dark-800) 25%,
                var(--color-dark-700) 50%,
                var(--color-dark-800) 75%
            );
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 0.25rem;
        }

        /* Print styles */
        @media print {
            .styled-button,
            nav,
            .hover-lift {
                display: none;
            }

            body {
                background: white;
                color: black;
            }

            .styled-card {
                border: 1px solid #ddd;
                background: white;
                page-break-inside: avoid;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .styled-card {
                border: 2px solid var(--color-gold);
            }

            .styled-button {
                border: 2px solid currentColor;
            }
        }
    </style>

    <!-- Development: Babel Standalone (Remove in production!) -->
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    
    <!-- Application entry point -->
    <script type="text/babel" data-type="module">
        // Error boundary for better error handling
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }

            componentDidCatch(error, errorInfo) {
                console.error('Error caught by boundary:', error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex items-center justify-center min-h-screen p-4">
                            <div className="styled-card max-w-md text-center">
                                <h1 className="text-2xl font-bold text-gold mb-4">
                                    Something went wrong
                                </h1>
                                <p className="mb-4">
                                    We're sorry for the inconvenience. Please try refreshing the page.
                                </p>
                                <button 
                                    onClick={() => window.location.reload()} 
                                    className="styled-button"
                                >
                                    Refresh Page
                                </button>
                            </div>
                        </div>
                    );
                }

                return this.props.children;
            }
        }

        // Lazy load the main app
        const loadApp = async () => {
            try {
                const module = await import('./index.tsx');
                return module.default;
            } catch (error) {
                console.error('Failed to load app:', error);
                throw error;
            }
        };

        // Initialize app with error boundary
        const root = ReactDOM.createRoot(document.getElementById('root'));
        
        loadApp().then(App => {
            root.render(
                <React.StrictMode>
                    <ErrorBoundary>
                        <App />
                    </ErrorBoundary>
                </React.StrictMode>
            );
        }).catch(error => {
            root.render(
                <div className="flex items-center justify-center min-h-screen p-4">
                    <div className="styled-card max-w-md text-center">
                        <h1 className="text-2xl font-bold text-gold mb-4">
                            Failed to Load Application
                        </h1>
                        <p className="mb-4">
                            Please check your connection and try again.
                        </p>
                        <button 
                            onClick={() => window.location.reload()} 
                            className="styled-button"
                        >
                            Retry
                        </button>
                    </div>
                </div>
            );
        });
    </script>

    <!-- Performance monitoring (optional) -->
    <script>
        // Log Core Web Vitals
        if ('PerformanceObserver' in window) {
            const observer = new PerformanceObserver((list) => {
                for (const entry of list.getEntries()) {
                    console.log(`${entry.name}:`, entry.value);
                }
            });
            
            try {
                observer.observe({ entryTypes: ['largest-contentful-paint', 'first-input', 'layout-shift'] });
            } catch (e) {
                // Browser doesn't support all metrics
            }
        }
    </script>
